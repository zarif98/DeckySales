version: 2

# Dependabot opens PRs against this repo; CI (type check, tests, our build and
# the plugin store's own build) runs on each one, so a breaking bump shows up
# as a red check rather than as a broken release.

updates:
  - package-ecosystem: "npm" # covers pnpm; the lockfile is pnpm v9
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies"]

    # One PR for the routine stuff, individual PRs for majors so each gets
    # looked at properly rather than buried in a batch.
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]



  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels: ["dependencies", "ci"]
    groups:
      actions:
        patterns: ["*"]

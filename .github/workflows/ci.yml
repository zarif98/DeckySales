name: CI

# Build, type check and test every push and pull request, and leave a
# ready-to-install zip attached to each run so the latest build is always
# one download away without cutting a release.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # corepack reads "packageManager" from package.json, so the CI pnpm is
      # exactly the one the lockfile was written with. Avoids a third-party
      # action for something the toolchain already does.
      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # plugin.json's version is what the Decky store reads; package.json's is
      # what the archive script names the zip after. A mismatch ships a plugin
      # whose filename and manifest disagree, which is easy to miss by hand.
      - name: Check version fields agree
        run: |
          PKG=$(node -p "require('./package.json').version")
          PLG=$(node -p "require('./plugin.json').version")
          echo "package.json=$PKG  plugin.json=$PLG"
          if [ "$PKG" != "$PLG" ]; then
            echo "::error file=plugin.json::version mismatch: package.json=$PKG, plugin.json=$PLG"
            exit 1
          fi

      # Must report errors in src/ paths. If @types/node drifts ahead of what
      # TypeScript 4.7 can parse, tsc aborts inside node_modules and silently
      # checks nothing - which is how a real bug reached a release once.
      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Package plugin
        run: pnpm run archive

      - name: Verify the package contains what it should
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ZIP="deckysales-v${VERSION}.zip"
          unzip -o -q "$ZIP" -d _verify
          for f in DeckySales/dist/index.js DeckySales/main.py DeckySales/plugin.json DeckySales/LICENSE DeckySales/NOTICE; do
            if [ ! -f "_verify/$f" ]; then
              echo "::error::missing from package: $f"
              exit 1
            fi
          done
          if grep -q "vitest" _verify/DeckySales/dist/index.js; then
            echo "::error::test code leaked into the bundle"
            exit 1
          fi
          echo "Package OK:"; ls -R _verify/DeckySales

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: deckysales-${{ github.sha }}
          path: deckysales-*.zip
          if-no-files-found: error
          retention-days: 30

  store-build:
    name: Store build (Decky CLI)
    runs-on: ubuntu-latest
    # Reproduces the plugin store's own build: same CLI release, same command,
    # same directory layout (build-plugins.yml in decky-plugin-database). The
    # store builds your repo with this, not with our archive script, so a
    # failure here is a failure the reviewer would see on the submission PR.

    steps:
      - uses: actions/checkout@v4
        with:
          # The store checks plugins out as plugins/<name>; with
          # "-s directory" the CLI names the zip after that directory.
          path: plugins/DeckySales

      - name: Download Decky CLI (the version the store uses)
        run: |
          mkdir -p /tmp/decky-cli
          curl -fsSL -o /tmp/decky-cli/decky \
            "https://github.com/SteamDeckHomebrew/cli/releases/download/0.0.7/decky-linux-x86_64"
          chmod +x /tmp/decky-cli/decky
          echo "/tmp/decky-cli" >> "$GITHUB_PATH"

      - name: Build exactly as the store does
        run: |
          # Run as root to get around Docker's permissions, as the store does.
          sudo "$(which decky)" plugin build -b -o /tmp/output -s directory plugins/DeckySales
          sudo chown -R "$(whoami)" plugins/DeckySales /tmp/output

      - name: Check what the store would publish
        run: |
          ZIP=/tmp/output/DeckySales.zip
          if [ ! -f "$ZIP" ]; then
            echo "::error::store build produced no DeckySales.zip"; ls -la /tmp/output; exit 1
          fi
          unzip -l "$ZIP"
          # The store's upload step reads these two files out of the zip.
          NAME=$(unzip -p "$ZIP" DeckySales/plugin.json | jq -r '.name')
          VERSION=$(unzip -p "$ZIP" DeckySales/package.json | jq -r '.version')
          echo "plugin.json name=$NAME  package.json version=$VERSION"
          [ "$NAME" = "DeckySales" ] || { echo "::error::plugin.json name is '$NAME'"; exit 1; }
          # NOTICE ships via defaults/, which the CLI copies into the plugin root.
          for f in DeckySales/dist/index.js DeckySales/plugin.json DeckySales/package.json DeckySales/main.py DeckySales/NOTICE; do
            unzip -l "$ZIP" | grep -q " $f$" || { echo "::error::missing from store build: $f"; exit 1; }
          done
          if ! unzip -l "$ZIP" | grep -qE " DeckySales/LICENSE(\.md)?$"; then
            echo "::error::no LICENSE in the store build"; exit 1
          fi

      - name: Upload store build
        uses: actions/upload-artifact@v4
        with:
          name: store-build-${{ github.sha }}
          path: /tmp/output/*.zip
          retention-days: 14
